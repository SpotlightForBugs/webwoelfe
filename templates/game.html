<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Atmospheric elements -->
    <div class="full-moon"></div>
    <div class="fog"></div>
    
    <!-- Audio elements -->
    <audio id="background-music" loop>
        <source src="/static/music/background_music.mp3" type="audio/mp3">
    </audio>
    
    <div id="music-controls" title="Toggle background music">
        <i class="fas fa-volume-up" id="music-icon"></i>
    </div>

    <div class="container">
        <h1>Werewolf</h1>
        
        <div id="join-section" class="card">
            <h2>Join Game</h2>
            <div id="game-info">
                <p>Game ID: <span id="game-id">{{ game.id }}</span></p>
                <p>Players: <span id="player-count">0</span> / {{ game.player_count }}</p>
                <p>Status: <span id="game-status">{{ game.status }}</span></p>
            </div>
            
            <form id="player-join-form">
                <div class="form-group">
                    <label for="player-name">Your Name:</label>
                    <input type="text" id="player-name" required>
                </div>
                
                <button type="submit" class="btn primary">Join Game</button>
            </form>
        </div>
        
        <div id="game-section" class="hidden">
            <div class="card">
                <h2>Game <span id="display-game-id"></span></h2>
                <div class="player-info">
                    <p>Name: <span id="display-name"></span></p>
                    <p>Role: <span id="display-role"></span></p>
                    <p>Status: <span id="display-status"></span></p>
                </div>
                
                <div id="phase-info">
                    <h3>Current Phase: <span id="display-phase"></span></h3>
                    <p id="phase-message"></p>
                </div>
            </div>
            
            <div id="action-section" class="card hidden">
                <h3>Your Actions</h3>
                <div id="action-buttons"></div>
                
                <div id="target-selection" class="hidden">
                    <h4>Select a target:</h4>
                    <select id="target-select"></select>
                    <button id="confirm-action" class="btn primary">Confirm</button>
                </div>
            </div>
            
            <div id="voting-section" class="card hidden">
                <h3>Vote</h3>
                <p>Select a player to vote for execution:</p>
                <select id="vote-select"></select>
                <button id="confirm-vote" class="btn primary">Vote</button>
            </div>
            
            <div id="players-list" class="card">
                <h3>Players</h3>
                <ul id="player-list"></ul>
            </div>
            
            <div id="game-log" class="card">
                <h3>Game Log</h3>
                <div id="log-container"></div>
            </div>
        </div>
        
        <div id="game-over" class="card hidden">
            <div class="blood-drip"></div>
            <h2>Game Over</h2>
            <p id="winner-message"></p>
            <button id="new-game" class="btn primary">Start New Game</button>
        </div>
    </div>
    
    <script>
        // Game state
        let playerToken = localStorage.getItem('player_token');
        let gameId = '{{ game.id }}';
        let player = null;
        let socket = null;
        let currentPhase = null;
        let players = [];
        let otherWerewolves = [];
        let lovers = [];
        let backgroundMusic = document.getElementById('background-music');
        let musicIcon = document.getElementById('music-icon');
        let musicPlaying = false;
        
        // DOM Elements
        const joinSection = document.getElementById('join-section');
        const gameSection = document.getElementById('game-section');
        const gameOverSection = document.getElementById('game-over');
        const actionSection = document.getElementById('action-section');
        const votingSection = document.getElementById('voting-section');
        const targetSelection = document.getElementById('target-selection');
        const playerJoinForm = document.getElementById('player-join-form');
        const playerCountDisplay = document.getElementById('player-count');
        const gameStatusDisplay = document.getElementById('game-status');
        const displayGameId = document.getElementById('display-game-id');
        const displayName = document.getElementById('display-name');
        const displayRole = document.getElementById('display-role');
        const displayStatus = document.getElementById('display-status');
        const displayPhase = document.getElementById('display-phase');
        const phaseMessage = document.getElementById('phase-message');
        const actionButtons = document.getElementById('action-buttons');
        const targetSelect = document.getElementById('target-select');
        const voteSelect = document.getElementById('vote-select');
        const playerList = document.getElementById('player-list');
        const logContainer = document.getElementById('log-container');
        const musicControls = document.getElementById('music-controls');
        
        // Initialize game
        function init() {
            // Set up music toggle
            musicControls.addEventListener('click', toggleMusic);
            
            // If player already joined
            if (playerToken) {
                fetch(`/api/player/${playerToken}`)
                    .then(response => {
                        if (response.ok) {
                            return response.json();
                        }
                        throw new Error('Player not found');
                    })
                    .then(data => {
                        player = data;
                        joinSection.classList.add('hidden');
                        gameSection.classList.remove('hidden');
                        setupGame();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        localStorage.removeItem('player_token');
                    });
            }
            
            // Refresh game info
            refreshGameInfo();
        }
        
        // Toggle background music
        function toggleMusic() {
            if (musicPlaying) {
                backgroundMusic.pause();
                musicIcon.className = 'fas fa-volume-mute';
            } else {
                backgroundMusic.play().catch(e => {
                    console.warn('Auto-play prevented. User must interact with the document first.', e);
                });
                musicIcon.className = 'fas fa-volume-up';
            }
            musicPlaying = !musicPlaying;
        }
        
        // Refresh game info
        function refreshGameInfo() {
            fetch(`/api/games/${gameId}`)
                .then(response => response.json())
                .then(data => {
                    gameStatusDisplay.textContent = data.status;
                    
                    // If the game has started, update the phase
                    if (data.status === 'running' && data.phase) {
                        currentPhase = data.phase;
                        if (displayPhase) {
                            displayPhase.textContent = currentPhase;
                        }
                        updatePhaseUI();
                    }
                    
                    fetch(`/api/games/${gameId}/players`)
                        .then(response => response.json())
                        .then(playerData => {
                            players = playerData;
                            playerCountDisplay.textContent = players.length;
                            updatePlayerList();
                            
                            if (data.status === 'ended') {
                                showGameOver(data.phase);
                            }
                        });
                });
            
            // Refresh logs
            fetch(`/api/games/${gameId}/logs`)
                .then(response => response.json())
                .then(logs => {
                    logContainer.innerHTML = '';
                    logs.forEach(log => {
                        const logEntry = document.createElement('div');
                        logEntry.classList.add('log-entry');
                        
                        const time = new Date(log.timestamp);
                        const timeStr = time.toLocaleTimeString();
                        
                        logEntry.innerHTML = `<span class="log-time">[${timeStr}]</span> ${log.message}`;
                        logContainer.prepend(logEntry);
                    });
                });
        }
        
        // Join game form submission
        playerJoinForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const playerName = document.getElementById('player-name').value;
            
            fetch(`/api/games/${gameId}/join`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `name=${encodeURIComponent(playerName)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    player = data.player;
                    playerToken = data.token;
                    localStorage.setItem('player_token', playerToken);
                    
                    joinSection.classList.add('hidden');
                    gameSection.classList.remove('hidden');
                    setupGame();
                    
                    // Try to play music when the user joins
                    if (!musicPlaying) {
                        toggleMusic();
                    }
                } else {
                    alert(data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to join game');
            });
        });
        
        // Setup game after joining
        function setupGame() {
            displayGameId.textContent = gameId;
            displayName.textContent = player.name;
            displayRole.textContent = player.role || 'Waiting for role assignment...';
            displayStatus.textContent = player.status;
            
            // Add role-specific class to body
            if (player.role) {
                document.body.classList.add('role-' + player.role.toLowerCase());
            }
            
            // Connect to socket
            socket = io();
            
            socket.on('connect', function() {
                socket.emit('join_game', {
                    game_id: gameId,
                    token: playerToken
                });
            });
            
            socket.on('joined', function(data) {
                console.log('Joined game', data);
                refreshGameInfo();
            });
            
            socket.on('game_started', function(data) {
                console.log('Game started', data);
                // Refresh player data to get role assignment
                fetch(`/api/player/${playerToken}`)
                    .then(response => response.json())
                    .then(updatedPlayer => {
                        player = updatedPlayer;
                        displayRole.textContent = player.role;
                        
                        // Add role-specific class to body
                        if (player.role) {
                            document.body.classList.add('role-' + player.role.toLowerCase());
                        }
                        
                        // Update current phase
                        currentPhase = data.phase;
                        displayPhase.textContent = currentPhase;
                        
                        // Update body class for styling
                        document.body.classList.remove('day-phase', 'night-phase');
                        document.body.classList.add(currentPhase + '-phase');
                        
                        updatePhaseUI();
                    });
            });
            
            socket.on('game_log', function(data) {
                const logEntry = document.createElement('div');
                logEntry.classList.add('log-entry');
                
                const time = new Date(data.timestamp);
                const timeStr = time.toLocaleTimeString();
                
                logEntry.innerHTML = `<span class="log-time">[${timeStr}]</span> ${data.message}`;
                logContainer.prepend(logEntry);
                
                // Add a howl for werewolf actions
                if (data.message.includes('werewolves')) {
                    playSound('howl');
                }
                
                // Add a scream for killing
                if (data.message.includes('killed')) {
                    playSound('scream');
                }
            });
            
            socket.on('phase_change', function(data) {
                currentPhase = data.phase;
                displayPhase.textContent = currentPhase;
                
                // Update body class for styling
                document.body.classList.remove('day-phase', 'night-phase');
                document.body.classList.add(currentPhase + '-phase');
                
                updatePhaseUI();
                refreshGameInfo();
                
                // Play phase change sound
                playSound(currentPhase);
            });
            
            socket.on('seer_result', function(data) {
                const roleEmoji = data.role === 'Werwolf' ? '🐺' : '👨‍👩‍👧‍👦';
                alert(`${data.target_name} is a ${data.role} ${roleEmoji}`);
            });
            
            socket.on('werewolf_info', function(data) {
                otherWerewolves = data.other_werewolves || [];
                if (otherWerewolves.length > 0) {
                    // Create a message about other werewolves
                    const werewolfNames = otherWerewolves.map(w => w.name).join(', ');
                    const message = `Your werewolf allies are: ${werewolfNames} 🐺`;
                    
                    // Add to log
                    const logEntry = document.createElement('div');
                    logEntry.classList.add('log-entry', 'werewolf-info');
                    logEntry.innerHTML = message;
                    logContainer.prepend(logEntry);
                    
                    // Also show an alert
                    alert(message);
                }
            });
            
            socket.on('lover_paired', function(data) {
                if (data.lover_id === player.id) {
                    alert(`You are now in love with ${data.lover_name} ❤️`);
                    // Add lover info to player display
                    const loverInfo = document.createElement('p');
                    loverInfo.innerHTML = `Lover: <span class="lover-name">${data.lover_name} ❤️</span>`;
                    document.querySelector('.player-info').appendChild(loverInfo);
                }
            });
            
            // Refresh initially and then every 5 seconds
            refreshGameInfo();
            setInterval(refreshGameInfo, 5000);
        }
        
        // Play sound effects
        function playSound(type) {
            // Add custom sound effects here if you expand the game
            console.log('Sound effect:', type);
        }
        
        // Update player list
        function updatePlayerList() {
            playerList.innerHTML = '';
            
            players.forEach(p => {
                const li = document.createElement('li');
                
                // Add role emoji if known (only for self or if dead)
                let roleEmoji = '';
                if (player && player.id === p.id && p.role) {
                    roleEmoji = getRoleEmoji(p.role);
                } else if (p.status === 'dead' && p.role) {
                    roleEmoji = getRoleEmoji(p.role);
                } else if (player && player.role === 'Werwolf' && otherWerewolves.some(w => w.id === p.id)) {
                    // Show werewolf emoji for other werewolves if the player is a werewolf
                    roleEmoji = '🐺';
                }
                
                li.textContent = `${p.name} ${roleEmoji} (${p.status})`;
                
                if (p.status === 'dead') {
                    li.classList.add('dead');
                }
                
                // Show lover emoji if this player is in a lover relationship
                if (lovers.includes(p.id)) {
                    li.innerHTML += ' ❤️';
                }
                
                playerList.appendChild(li);
            });
        }
        
        // Get emoji for role
        function getRoleEmoji(role) {
            switch(role) {
                case 'Werwolf': return '🐺';
                case 'Seherin': return '👁️';
                case 'Hexe': return '🧙‍♀️';
                case 'Erzaehler': return '📚';
                case 'Armor': return '🛡️';
                case 'Jaeger': return '🏹';
                case 'Dorfbewohner': return '👨‍👩‍👧‍👦';
                default: return '';
            }
        }
        
        // Update UI based on game phase
        function updatePhaseUI() {
            actionSection.classList.add('hidden');
            votingSection.classList.add('hidden');
            
            if (!player || !player.role || player.status === 'dead') {
                phaseMessage.textContent = player.status === 'dead' 
                    ? 'You are dead. Watch the game unfold as a ghost. 👻' 
                    : 'Waiting for the game to start...';
                return;
            }
            
            if (currentPhase === 'night') {
                phaseMessage.textContent = 'It is night. The village sleeps while dark forces lurk in the shadows...';
                
                // Only show actions for roles with night actions
                if (['Werwolf', 'Hexe', 'Seherin', 'Armor'].includes(player.role)) {
                    actionSection.classList.remove('hidden');
                    setupNightActions();
                }
            } else if (currentPhase === 'day') {
                phaseMessage.textContent = 'It is day. The village awakens to discover a new victim. Who among you is a werewolf?';
                votingSection.classList.remove('hidden');
                setupDayVoting();
            }
        }
        
        // Setup night actions based on role
        function setupNightActions() {
            actionButtons.innerHTML = '';
            
            if (player.role === 'Werwolf') {
                // Show werewolf allies if there are any
                if (otherWerewolves.length > 0) {
                    const allyInfo = document.createElement('div');
                    allyInfo.classList.add('werewolf-allies');
                    allyInfo.innerHTML = `<p>Your werewolf allies: ${otherWerewolves.map(w => w.name).join(', ')} 🐺</p>`;
                    actionButtons.appendChild(allyInfo);
                }
                
                const killBtn = document.createElement('button');
                killBtn.textContent = '🩸 Choose victim';
                killBtn.classList.add('btn', 'danger');
                killBtn.addEventListener('click', () => showTargetSelection('kill'));
                actionButtons.appendChild(killBtn);
            } 
            else if (player.role === 'Hexe') {
                const killBtn = document.createElement('button');
                killBtn.textContent = '☠️ Kill someone';
                killBtn.classList.add('btn', 'danger');
                killBtn.addEventListener('click', () => showTargetSelection('kill'));
                actionButtons.appendChild(killBtn);
                
                const healBtn = document.createElement('button');
                healBtn.textContent = '💉 Heal the victim';
                healBtn.classList.add('btn', 'success');
                healBtn.addEventListener('click', () => {
                    // Automatically send heal action on the last killed player
                    socket.emit('action', {
                        token: playerToken,
                        action_type: 'heal',
                        target_id: 'last_killed' // Backend will resolve this
                    });
                    alert('You have used your healing potion!');
                });
                actionButtons.appendChild(healBtn);
            }
            else if (player.role === 'Seherin') {
                const seeBtn = document.createElement('button');
                seeBtn.textContent = '👁️ See someone\'s role';
                seeBtn.classList.add('btn', 'info');
                seeBtn.addEventListener('click', () => showTargetSelection('see'));
                actionButtons.appendChild(seeBtn);
            }
            else if (player.role === 'Armor') {
                const protectBtn = document.createElement('button');
                protectBtn.textContent = '🛡️ Protect someone';
                protectBtn.classList.add('btn', 'success');
                protectBtn.addEventListener('click', () => showTargetSelection('protect'));
                actionButtons.appendChild(protectBtn);
                
                // Add button for creating lovers (Verliebte)
                const loverBtn = document.createElement('button');
                loverBtn.textContent = '❤️ Create Lovers';
                loverBtn.classList.add('btn', 'info');
                loverBtn.addEventListener('click', () => showLoverSelection());
                actionButtons.appendChild(loverBtn);
            }
        }
        
        // Show lover selection for Armor
        function showLoverSelection() {
            targetSelection.classList.remove('hidden');
            targetSelect.innerHTML = '';
            
            // We need exactly 2 lovers
            const possibleLovers = players.filter(p => p.status === 'alive');
            
            // Create first selection
            const firstLoverSelect = document.createElement('select');
            firstLoverSelect.id = 'first-lover-select';
            firstLoverSelect.classList.add('lover-select');
            
            // Create second selection
            const secondLoverSelect = document.createElement('select');
            secondLoverSelect.id = 'second-lover-select';
            secondLoverSelect.classList.add('lover-select');
            
            // Populate both dropdowns
            possibleLovers.forEach(p => {
                const option1 = document.createElement('option');
                option1.value = p.id;
                option1.textContent = p.name;
                firstLoverSelect.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = p.id;
                option2.textContent = p.name;
                secondLoverSelect.appendChild(option2);
            });
            
            // Replace the normal target select with two lover selects
            targetSelect.style.display = 'none';
            const selectionContainer = document.createElement('div');
            selectionContainer.classList.add('lover-selection');
            selectionContainer.innerHTML = `
                <p>Select first lover:</p>
                <p>Select second lover:</p>
            `;
            selectionContainer.querySelector('p:first-child').appendChild(firstLoverSelect);
            selectionContainer.querySelector('p:last-child').appendChild(secondLoverSelect);
            
            targetSelection.insertBefore(selectionContainer, document.getElementById('confirm-action'));
            
            // Update confirm action button
            document.getElementById('confirm-action').onclick = function() {
                const lover1 = firstLoverSelect.value;
                const lover2 = secondLoverSelect.value;
                
                if (lover1 === lover2) {
                    alert('You must choose two different players!');
                    return;
                }
                
                // Add the lovers to our tracked list
                lovers = [lover1, lover2];
                
                // Emit an event to set up lovers
                socket.emit('action', {
                    token: playerToken,
                    action_type: 'create_lovers',
                    target_id: lover1,
                    second_target: lover2
                });
                
                // Get the names for the alert
                const lover1Name = possibleLovers.find(p => p.id === lover1).name;
                const lover2Name = possibleLovers.find(p => p.id === lover2).name;
                
                alert(`You've created a love bond between ${lover1Name} and ${lover2Name} ❤️`);
                
                // Hide and clean up
                targetSelection.classList.add('hidden');
                selectionContainer.remove();
                targetSelect.style.display = '';
            };
        }
        
        // Show target selection UI
        function showTargetSelection(actionType) {
            targetSelection.classList.remove('hidden');
            targetSelect.innerHTML = '';
            
            // Filter out dead players and self
            let targets = players.filter(p => 
                p.status === 'alive' && 
                p.id !== player.id
            );
            
            // Special filtering for werewolves
            if (player.role === 'Werwolf') {
                // Werewolves can't kill other werewolves
                targets = targets.filter(p => !otherWerewolves.some(w => w.id === p.id));
            }
            
            targets.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.name;
                targetSelect.appendChild(option);
            });
            
            document.getElementById('confirm-action').onclick = function() {
                const targetId = targetSelect.value;
                
                socket.emit('action', {
                    token: playerToken,
                    action_type: actionType,
                    target_id: targetId
                });
                
                alert(`Action ${actionType} confirmed on ${targets.find(t => t.id === targetId).name}`);
                targetSelection.classList.add('hidden');
            };
        }
        
        // Setup day voting
        function setupDayVoting() {
            voteSelect.innerHTML = '';
            
            // Filter out dead players and self
            const targets = players.filter(p => p.status === 'alive' && p.id !== player.id);
            
            targets.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.name;
                voteSelect.appendChild(option);
            });
            
            document.getElementById('confirm-vote').onclick = function() {
                const targetId = voteSelect.value;
                
                socket.emit('vote', {
                    token: playerToken,
                    target_id: targetId
                });
                
                alert(`You voted to execute ${targets.find(t => t.id === targetId).name}`);
                votingSection.classList.add('hidden');
                phaseMessage.textContent = 'Waiting for other players to vote...';
            };
        }
        
        // Show game over screen
        function showGameOver(result) {
            gameSection.classList.add('hidden');
            gameOverSection.classList.remove('hidden');
            
            // Add specific class for styling
            gameOverSection.className = 'card';
            gameOverSection.classList.add(result);
            
            const winnerMessage = document.getElementById('winner-message');
            if (result === 'villagers_win') {
                winnerMessage.textContent = 'The villagers have won! All werewolves have been eliminated.';
                gameOverSection.classList.add('villagers-win');
                if (player.role !== 'Werwolf') {
                    winnerMessage.textContent += ' Congratulations!';
                }
            } else {
                winnerMessage.textContent = 'The werewolves have won! They have devoured enough villagers to take over the village.';
                gameOverSection.classList.add('werewolves-win');
                if (player.role === 'Werwolf') {
                    winnerMessage.textContent += ' Congratulations!';
                }
            }
            
            document.getElementById('new-game').addEventListener('click', function() {
                window.location.href = '/';
            });
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Werewolf Game</h1>
        
        <div class="card">
            <h2>Create New Game</h2>
            <form action="/games" method="post">
                <div class="form-group">
                    <label for="player_count">Number of Players (8-18):</label>
                    <input type="number" id="player_count" name="player_count" min="8" max="18" value="8">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="random_storyteller"> 
                        Random Storyteller
                    </label>
                </div>
                
                <button type="submit" class="btn primary">Create Game</button>
            </form>
        </div>
        
        <div class="card">
            <h2>Join Existing Game</h2>
            <form id="join-form">
                <div class="form-group">
                    <label for="game_id">Game ID:</label>
                    <input type="text" id="game_id" name="game_id" required>
                </div>
                
                <button type="submit" class="btn secondary">Join Game</button>
            </form>
        </div>
    </div>
    
    <script>
        document.getElementById('join-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const gameId = document.getElementById('game_id').value;
            window.location.href = '/game/' + gameId;
        });
    </script>
</body>
</html>
